services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - user_data:/app/backend/users
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "-m", "backend.worker"]
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - user_data:/app/backend/users
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  user_data:
